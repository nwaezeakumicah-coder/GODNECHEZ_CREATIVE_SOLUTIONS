<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Client Testimonials | GODNECHEZ CREATIVE SOLUTIONS</title>

<style>

:root{

--blue:#0A3D91;
--navy:#061B3A;
--white:#FFFFFF;
--yellow:#FFD400;
--red:#E63946;
--gray:#6B7280;

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}

body{

background:var(--white);
color:var(--navy);

}

/* NAVBAR */

header{

position:fixed;
top:0;
width:100%;

background:rgba(10,61,145,.95);

backdrop-filter:blur(15px);

border-bottom:1px solid rgba(255,255,255,.2);

z-index:1000;

}

.navbar{

max-width:1200px;

margin:auto;

padding:15px 20px;

display:flex;

justify-content:space-between;

align-items:center;

}

/* BRAND */

.brand{

display:flex;

align-items:center;

gap:12px;

}

.brand img{

width:45px;
height:45px;
object-fit:contain;

}

.logo-text{

display:flex;
flex-direction:column;

font-size:20px;
font-weight:900;
line-height:1;

color:white;

}

.logo-text span{

font-size:11px;
letter-spacing:1px;
color:var(--yellow);

}

/* NAV LINKS */

.nav{

display:flex;
align-items:center;
gap:22px;

}

.nav a{

text-decoration:none;
color:white;
font-weight:bold;
font-size:14px;
transition:.3s;

}

.nav a:hover{

color:var(--yellow);

}

.nav a.active{

color:var(--yellow);

}

.admin-link{

background:var(--yellow);
color:var(--navy)!important;

padding:10px 18px;
border-radius:30px;

}

.admin-link:hover{

background:var(--red);
color:white!important;

}

.menu{

display:none;

font-size:28px;
cursor:pointer;
color:white;

}

/* HERO */

.hero{

background:
radial-gradient(
circle at top right,
rgba(255,212,0,.18),
transparent 35%
),
var(--blue);

color:white;

padding:140px 20px 90px;

text-align:center;

}

.hero h1{

font-size:3rem;

margin-bottom:15px;

}

.hero span{

color:var(--yellow);

}

.hero p{

font-size:18px;

opacity:.9;

max-width:700px;

margin:auto;

}

/* TESTIMONIAL FORM */

.container{

max-width:700px;

margin:auto;

padding:70px 20px;

}

.box{

background:#f5f8ff;

padding:35px;

border-radius:20px;

border-top:5px solid var(--yellow);

box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.box h2{

margin-bottom:20px;

color:var(--navy);

text-align:center;

}

input,
textarea{

width:100%;

padding:14px;

margin:10px 0;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;

}

input:focus,
textarea:focus{

outline:none;

border-color:var(--blue);

box-shadow:0 0 0 3px rgba(10,61,145,.15);

}

textarea{

height:150px;

resize:none;

}

button{

width:100%;

background:var(--yellow);

color:var(--navy);

border:none;

padding:14px;

border-radius:30px;

font-weight:bold;

cursor:pointer;

transition:.3s;

margin-top:10px;

}

button:hover{

background:var(--red);

color:white;

}

.status{

margin-top:15px;

text-align:center;

font-weight:bold;

}

/* FOOTER */

footer{

background:var(--navy);

color:white;

padding:40px;

text-align:center;

margin-top:40px;

}

/* MOBILE */

@media(max-width:768px){

.nav{

position:fixed;

top:75px;

right:-100%;

width:260px;

height:100vh;

background:var(--blue);

display:flex;

flex-direction:column;

padding:30px;

gap:25px;

transition:.4s;

}

.nav.show{

right:0;

}

.nav a{

color:white;

}

.menu{

display:block;

}

.hero h1{

font-size:2.3rem;

}

}

</style>

</head>

<body>

<header>

<div class="navbar">

<div class="brand">

<img src="images/Untitled-1.png" alt="GODNECHEZ Logo">

<div class="logo-text">

GODNECHEZ

<span>

CREATIVE SOLUTIONS

</span>

</div>

</div>

<div class="nav" id="nav">

<a href="home.html">Home</a>

<a href="portfolio.html">Portfolio</a>

<a href="services.html">Services</a>

<a href="about.html">About</a>

<a href="faq.html">FAQ</a>

<a href="testimonials.html" class="active">Testimonials</a>

<a href="contact.html">Contact</a>

<a href="admin-login.html" class="admin-link">

👤 Admin Login

</a>

</div>

<div class="menu" onclick="toggleMenu()">

☰

</div>

</div>

</header>

<section class="hero">

<h1>

Share Your

<span>

Experience

</span>

</h1>

<p>

Your feedback helps us grow and serve our clients better.

</p>

</section>

<div class="container">

<div class="box">

<h2>

Leave A Testimonial

</h2>

<input
id="testimonialName"
type="text"
placeholder="Your Name">

<textarea
id="testimonialMessage"
placeholder="Tell us about your experience"></textarea>

<button onclick="sendTestimonial()">

Submit Review

</button>

<p id="status" class="status"></p>

</div>

</div>

<footer>

© 2026 GODNECHEZ CREATIVE SOLUTIONS

</footer>

<script>

const API = "https://godnechez-creative-solutions.onrender.com";

function toggleMenu(){

document
.getElementById("nav")
.classList.toggle("show");

}

async function sendTestimonial(){

const nameInput =
document.getElementById("testimonialName");

const messageInput =
document.getElementById("testimonialMessage");

const status =
document.getElementById("status");

const nameValue =
nameInput.value.trim();

const messageValue =
messageInput.value.trim();

if(!nameValue || !messageValue){

status.innerHTML =
"Please fill all fields.";

return;

}

status.innerHTML =
"Submitting review...";

try{

const res = await fetch(

API + "/api/testimonials",

{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:nameValue,

message:messageValue

})

}

);

const result = await res.json();

if(result.success){

status.innerHTML =
"Thank you! Your testimonial is awaiting approval.";

nameInput.value = "";
messageInput.value = "";

}
else{

status.innerHTML =
result.message || "Submission failed.";

}

}
catch(error){

console.error(error);

status.innerHTML =
"Server connection error.";

}

}

</script>

</body>

</html>
