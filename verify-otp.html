<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify OTP</title>

<style>

body{

font-family:Arial,sans-serif;

background:#0B0F14;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

margin:0;

}

.box{

background:white;

padding:30px;

width:350px;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,.3);

}

h2{

margin-bottom:20px;

}

input{

width:100%;

padding:12px;

margin:10px 0;

box-sizing:border-box;

border:1px solid #ddd;

border-radius:8px;

}

button{

width:100%;

padding:12px;

background:#0f4cb4;

color:white;

border:none;

border-radius:8px;

font-weight:bold;

cursor:pointer;

margin-top:10px;

}

button:hover{

opacity:.9;

}

#message{

margin-top:15px;

font-size:14px;

text-align:center;

}

</style>

</head>

<body>

<div class="box">

<h2>Enter OTP</h2>

<input
id="otp"
placeholder="6 Digit OTP"
maxlength="6">

<button onclick="verifyOTP()">

Verify OTP

</button>

<p id="message"></p>

</div>

<script>

const API = "https://godnechez-creative-solutions.onrender.com";

async function verifyOTP(){

const email =
localStorage.getItem("resetEmail");

const otpValue =
document.getElementById("otp").value.trim();

const message =
document.getElementById("message");

if(!email){

message.innerHTML =
"Reset session expired. Start again.";

return;

}

if(!otpValue){

message.innerHTML =
"Please enter the OTP.";

return;

}

try{

const res = await fetch(

API + "/api/admin/verify-otp",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email,

otp:otpValue

})

}

);

const data = await res.json();

if(data.success){

window.location.href =
"reset-password.html";

}

else{

message.innerHTML =
data.message || "Invalid OTP";

}

}

catch(error){

console.error(error);

message.innerHTML =
"Server connection error";

}

}

</script>

</body>

</html>
