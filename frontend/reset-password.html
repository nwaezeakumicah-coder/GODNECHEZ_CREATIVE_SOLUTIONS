<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password</title>


<style>

body{

font-family:Arial;

background:#0B0F14;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}


.box{

background:white;

padding:30px;

width:350px;

border-radius:15px;

}


input{

width:100%;

padding:12px;

margin:10px 0;

box-sizing:border-box;

}


button{

width:100%;

padding:12px;

background:#0f4cb4;

border:none;

font-weight:bold;

cursor:pointer;

margin-top:10px;

}


#message{

margin-top:15px;

}


</style>


</head>



<body>


<div class="box">


<h2>Reset Password</h2>


<input 
id="email"
type="email"
placeholder="Admin Email">



<input 
id="otp"
placeholder="Enter OTP">



<input 
id="password"
type="password"
placeholder="New Password">





<button onclick="verifyOTP()">

Verify OTP

</button>


<button onclick="resetPassword()">

Change Password

</button>



<p id="message"></p>


</div>






<script>


const API="https://godnechez-creative-solutions.onrender.com/";





async function verifyOTP(){



const res = await fetch(

API+"/api/admin/verify-otp",

{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

email:email.value,

otp:otp.value

})


}

);





const data = await res.json();





message.innerHTML=data.message;



}








async function resetPassword(){



const res = await fetch(

API+"/api/admin/reset-password",

{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

email:email.value,

password:password.value

})


}

);





const data = await res.json();





message.innerHTML=data.message;



if(data.success){


setTimeout(()=>{


window.location.href="admin-login.html";


},1500);


}



}



</script>



</body>


</html>
