<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logo Designs | GODNECHEZ CREATIVE</title>

<style>

:root{

--blue:#0A3D91;
--navy:#061B3A;
--white:#FFFFFF;
--yellow:#FFD400;
--red:#E63946;
--gray:#6B7280;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}


body{

background:var(--white);

color:var(--navy);

overflow-x:hidden;

}




/* NAVBAR */

header{

position:fixed;

top:0;

width:100%;

background:rgba(10,61,145,.95);

backdrop-filter:blur(15px);

border-bottom:1px solid rgba(255,255,255,.2);

z-index:1000;

}




.navbar{

max-width:1200px;

margin:auto;

padding:15px 20px;

display:flex;

justify-content:space-between;

align-items:center;

}





/* BRAND */


.brand{

display:flex;

align-items:center;

gap:12px;

}



.brand img{

width:45px;

height:45px;

object-fit:contain;

}




.logo-text{

display:flex;

flex-direction:column;

font-size:20px;

font-weight:900;

line-height:1;

color:white;

}




.logo-text span{

font-size:11px;

letter-spacing:1px;

color:var(--yellow);

}





/* NAV LINKS */


.nav{

display:flex;

align-items:center;

gap:22px;

}




.nav a{

text-decoration:none;

color:white;

font-weight:bold;

font-size:14px;

transition:.3s;

}




.nav a:hover{

color:var(--yellow);

}





.admin-link{

background:var(--yellow);

color:var(--navy)!important;

padding:10px 18px;

border-radius:30px;

}




.admin-link:hover{

background:var(--red);

color:white!important;

}





.menu{

display:none;

font-size:28px;

cursor:pointer;

color:white;

}



/* HERO */


.hero{

text-align:center;

padding:140px 20px 50px;

background:

radial-gradient(

circle at top right,

rgba(255,212,0,.2),

transparent 35%

);

animation:fadeDown 1s ease;

}



.hero h1{

font-size:3rem;

}



.hero span{

color:var(--yellow);

}



.hero p{

margin-top:15px;

color:var(--gray);

font-size:18px;

}
/* CATEGORY NAV */


.categories{

text-align:center;

padding:30px 20px;

}



.categories a{

display:inline-block;

padding:12px 20px;

margin:6px;

background:#f1f5f9;

border-radius:30px;

text-decoration:none;

font-weight:bold;

color:var(--navy);

transition:.3s;

}



.categories a:hover{

background:var(--blue);

color:white;

transform:translateY(-3px);

}



.active{

background:var(--yellow)!important;

color:var(--navy)!important;

}





/* GALLERY */


.gallery{

max-width:1200px;

margin:auto;

padding:30px 20px;

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(240px,1fr));

gap:25px;

}




.card{

background:#f8fafc;

border-radius:20px;

overflow:hidden;

cursor:pointer;

transition:.4s;

box-shadow:0 10px 30px rgba(0,0,0,.08);

animation:showCard .7s ease;

}




.card:hover{

transform:translateY(-10px);

box-shadow:0 20px 40px rgba(10,61,145,.18);

}





.card img{

width:100%;

aspect-ratio:1/1;

object-fit:cover;

display:block;

}





.info{

padding:18px;

}





.info h3{

margin-bottom:8px;

color:var(--navy);

}





.info small{

color:var(--blue);

font-weight:bold;

}





/* LOAD MORE */


.load{

text-align:center;

padding:40px;

}





.load button{

padding:15px 35px;

border:none;

background:var(--yellow);

color:var(--navy);

border-radius:30px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}





.load button:hover{

background:var(--red);

color:white;

transform:scale(1.05);

}





/* MODAL */


.modal{

position:fixed;

inset:0;

background:rgba(6,27,58,.95);

display:none;

align-items:center;

justify-content:center;

z-index:2000;

padding:20px;

}





.modal img{

max-width:95%;

max-height:95%;

border-radius:20px;

animation:zoom .4s ease;

}





/* FOOTER */


footer{

background:var(--navy);

color:white;

padding:45px 20px;

text-align:center;

margin-top:60px;

}





/* ANIMATIONS */


@keyframes fadeDown{

from{

opacity:0;

transform:translateY(-40px);

}

to{

opacity:1;

transform:translateY(0);

}

}





@keyframes showCard{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}





@keyframes zoom{

from{

transform:scale(.7);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}





/* MOBILE */


@media(max-width:768px){


.nav{

position:fixed;

top:75px;

right:-100%;

width:250px;

height:100vh;

background:var(--white);

flex-direction:column;

padding:35px;

gap:25px;

transition:.4s;

box-shadow:-5px 0 20px rgba(0,0,0,.15);

}



.nav.show{

right:0;

}




.nav a{

color:var(--navy);

}





.menu{

display:block;

}





.hero h1{

font-size:2.3rem;

}



}

</style>

</head>
<body>


<header>


<div class="navbar">



<div class="brand">


<img src="logo.png" alt="GODNECHEZ Logo">



<div class="logo-text">


GODNECHEZ


<span>

CREATIVE SOLUTIONS

</span>


</div>


</div>







<div class="nav" id="nav">



<a href="index.html">
Home
</a>



<a href="portfolio.html">

<a href="services.html">

</div>







<div class="menu" onclick="toggleMenu()">

</div>


</header>







<section class="hero">


<h1>

Logo

<span>

Gallery

</span>


</h1>



<p>

Explore our professional logo design collection created by GODNECHEZ Creative Solutions.

</p>


</section>







<div class="categories">


<a href="portfolio.html">

All

</a>



<a href="logos.html" class="active">

Logos

</a>



<a href="flyers.html">

<a href="branding.html">

<a href="dtf.html">

<a href="banners.html">

</div>







<section class="gallery" id="gallery">


</section>







<div class="load">


<button onclick="loadMore()">

Load More Logos

</button>


</div>








<div class="modal" id="modal" onclick="closeModal()">



<img id="modalImage">



</div>







<footer>


© 2026 GODNECHEZ CREATIVE SOLUTIONS


</footer>







<script>


const API =

"http://localhost:5000/api/designs";



let logos = [];

let visible = 12;






async function getLogos(){



try{



const res = await fetch(API);



const data = await res.json();





logos = data.data.filter(item =>



(item.category || "")

.toLowerCase()

===

"logos"



);





display();



}





catch(err){



console.log(err);



}



}









function display(){



const gallery =

document.getElementById("gallery");




gallery.innerHTML = "";





logos

.slice(0,visible)

.forEach(item=>{



gallery.innerHTML += `



<div class="card"

onclick="openModal('${item.image}')">





<img

src="http://localhost:5000/uploads/${item.image}"

alt="${item.title}"

>






<div class="info">



<h3>

${item.title || "Logo Design"}

</h3>





<small>

${item.category || "Logo"}

</small>



</div>





</div>



`;



});



}








function loadMore(){



visible += 12;



display();



}








function openModal(image){



document

.getElementById("modal")

.style.display="flex";





document

.getElementById("modalImage")

.src =

"http://localhost:5000/uploads/" + image;



}







function closeModal(){



document

.getElementById("modal")

.style.display="none";



}








function toggleMenu(){



document

.getElementById("nav")

.classList.toggle("show");



}







getLogos();





</script>



</body>

</html>
