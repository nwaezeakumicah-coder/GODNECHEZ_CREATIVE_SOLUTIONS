<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Banner Designs | GODNECHEZ CREATIVE</title>


<style>

:root{

--black:#0B0F14;
--dark:#171B24;
--yellow:#FFD400;
--red:#E63946;
--gray:#6B7280;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}


body{

background:white;

color:var(--black);

overflow-x:hidden;

}



/* NAVBAR */


header{

position:sticky;

top:0;

background:rgba(255,255,255,.95);

backdrop-filter:blur(12px);

border-bottom:1px solid #eee;

z-index:1000;

}



.navbar{

max-width:1200px;

margin:auto;

padding:18px 20px;

display:flex;

justify-content:space-between;

align-items:center;

}



.logo{

font-size:20px;

font-weight:900;

}



.logo span{

color:var(--yellow);

}





.nav{

display:flex;

gap:25px;

}



.nav a{

text-decoration:none;

color:black;

font-weight:bold;

font-size:14px;

}



.nav a:hover{

color:var(--red);

}



.menu{

display:none;

font-size:28px;

cursor:pointer;

}





/* HERO */


.hero{

text-align:center;

padding:70px 20px 40px;

}



.hero h1{

font-size:3rem;

}



.hero span{

color:var(--yellow);

}



.hero p{

margin-top:15px;

color:var(--gray);

}





/* CATEGORY */


.categories{

text-align:center;

padding:20px;

}



.categories a{

display:inline-block;

padding:12px 18px;

margin:6px;

background:#eee;

border-radius:25px;

text-decoration:none;

color:black;

font-weight:bold;

}



.categories a:hover{

background:var(--yellow);

}



.active{

background:var(--yellow)!important;

}






/* GALLERY */


.gallery{

max-width:1200px;

margin:auto;

padding:30px 20px;

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(240px,1fr));

gap:25px;

}



.card{

background:#f5f5f5;

border-radius:18px;

overflow:hidden;

cursor:pointer;

transition:.3s;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}



.card:hover{

transform:translateY(-8px);

}



.card img{

width:100%;

aspect-ratio:1/1;

object-fit:cover;

display:block;

}



.info{

padding:15px;

}



.info small{

color:var(--gray);

}






/* LOAD */


.load{

text-align:center;

padding:40px;

}



.load button{

padding:14px 30px;

background:var(--yellow);

border:none;

border-radius:12px;

font-weight:bold;

cursor:pointer;

}






/* MODAL */


.modal{

position:fixed;

inset:0;

background:rgba(0,0,0,.92);

display:none;

align-items:center;

justify-content:center;

z-index:2000;

padding:20px;

}



.modal img{

max-width:95%;

max-height:95%;

border-radius:15px;

}







footer{

background:var(--dark);

color:white;

padding:40px;

text-align:center;

margin-top:60px;

}






@media(max-width:768px){


.nav{

position:fixed;

top:70px;

right:-100%;

width:230px;

height:100vh;

background:white;

flex-direction:column;

padding:30px;

transition:.4s;

}



.nav.show{

right:0;

}



.menu{

display:block;

}



.hero h1{

font-size:2.2rem;

}



}



</style>


</head>




<body>




<header>


<div class="navbar">


<div class="logo">

GODNECHEZ

<span>

CREATIVE

</span>

</div>





<div class="nav" id="nav">


<a href="index.html">

Home

</a>


<a href="portfolio.html">

Portfolio

</a>


<a href="services.html">

Services

</a>


<a href="about.html">

About

</a>


<a href="contact.html">

Contact

</a>


</div>




<div class="menu" onclick="toggleMenu()">

☰

</div>



</div>


</header>








<section class="hero">


<h1>

Banner

<span>

Gallery

</span>

</h1>


<p>

Explore our banner and large format designs.

</p>


</section>









<div class="categories">


<a href="portfolio.html">

All

</a>


<a href="logos.html">

Logos

</a>


<a href="flyers.html">

Flyers

</a>


<a href="branding.html">

Branding

</a>


<a href="dtf.html">

DTF

</a>


<a href="banners.html" class="active">

Banners

</a>


</div>









<section class="gallery" id="gallery">


</section>









<div class="load">


<button onclick="loadMore()">

Load More Banner Designs

</button>


</div>









<div class="modal" id="modal" onclick="closeModal()">



<img id="modalImage">


</div>









<footer>


© 2026 GODNECHEZ CREATIVE SOLUTIONS


</footer>









<script>


const API =

"http://localhost:5000/api/designs";



let banners=[];

let visible=12;






async function getBanners(){



try{


const res = await fetch(API);


const data = await res.json();




banners = data.data.filter(item =>

(item.category || "").toLowerCase() === "banners"

);



display();



}



catch(err){


console.log(err);


}


}









function display(){



const gallery =

document.getElementById("gallery");



gallery.innerHTML="";




banners

.slice(0,visible)

.forEach(item=>{


gallery.innerHTML +=`



<div class="card"

onclick="openModal('${item.image}')">



<img src="http://localhost:5000/uploads/${item.image}">



<div class="info">



<h3>

${item.title}

</h3>



<small>

${item.category}

</small>



</div>



</div>



`;


});



}








function loadMore(){


visible +=12;


display();


}








function openModal(image){



document

.getElementById("modal")

.style.display="flex";





document

.getElementById("modalImage")

.src=

"http://localhost:5000/uploads/"+image;



}








function closeModal(){


document

.getElementById("modal")

.style.display="none";


}







function toggleMenu(){



document

.getElementById("nav")

.classList.toggle("show");



}







getBanners();



</script>



</body>

</html>
