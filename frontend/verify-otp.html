<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify OTP</title>


<style>

body{

font-family:Arial;

background:#0B0F14;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}


.box{

background:white;

padding:30px;

width:350px;

border-radius:15px;

}


input{

width:100%;

padding:12px;

margin:10px 0;

}



button{

width:100%;

padding:12px;

background:#0f4cb4;

border:none;

font-weight:bold;

cursor:pointer;

}


</style>


</head>


<body>


<div class="box">


<h2>Enter OTP</h2>


<input 
id="otp"

placeholder="6 Digit OTP">



<button onclick="verifyOTP()">

Verify OTP

</button>



<p id="message"></p>


</div>







<script>


const API="https://godnechez-creative-solutions.onrender.com/";



async function verifyOTP(){



const email = localStorage.getItem(

"resetEmail"

);





const res = await fetch(

API+"/api/admin/verify-otp",

{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

email:email,

otp:otp.value

})


}

);





const data = await res.json();





if(data.success){


window.location.href="reset-password.html";


}


else{


message.innerHTML=data.message;


}



}



</script>


</body>

</html>
