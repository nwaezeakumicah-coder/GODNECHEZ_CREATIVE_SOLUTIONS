<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GODNECHEZ ADMIN DASHBOARD</title>


<style>

:root{

--black:#0B0F14;
--yellow:#FFD400;
--red:#E63946;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}


body{

background:#f5f5f5;
color:#111;

}



header{

background:var(--black);

color:white;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}


header button{

background:var(--yellow);

border:none;

padding:12px 20px;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}




.container{

max-width:1200px;

margin:auto;

padding:30px;

}



.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:20px;

margin-bottom:40px;

}



.stat-card{

background:white;

padding:25px;

border-radius:20px;

text-align:center;

}



.stat-card h1{

font-size:40px;

color:var(--yellow);

}





.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(350px,1fr));

gap:30px;

}



.box{

background:white;

padding:25px;

border-radius:20px;

}



input,
textarea,
select{

width:100%;

padding:12px;

margin:10px 0;

border-radius:10px;

border:1px solid #ddd;

}



textarea{

height:100px;

}



button{

background:var(--yellow);

border:none;

padding:12px 20px;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}



.delete{

background:var(--red);

color:white;

}



.cancel{

background:#333;

color:white;

}




.items{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:20px;

}



.item{

background:white;

padding:15px;

border-radius:15px;

}



.item img{

width:100%;

height:200px;

object-fit:cover;

border-radius:10px;

}




.message{

background:white;

padding:20px;

border-radius:15px;

}




@media(max-width:600px){


.container{

padding:15px;

}


.grid{

grid-template-columns:1fr;

}


}


</style>

</head>


<body>



<header>

<h2>
GODNECHEZ ADMIN
</h2>


<button onclick="logout()">
Logout
</button>


</header>






<div class="container">



<div class="stats">


<div class="stat-card">

<h1 id="designCount">
0
</h1>

<p>
Designs
</p>

</div>



<div class="stat-card">

<h1 id="teamCount">
0
</h1>

<p>
Team
</p>

</div>



<div class="stat-card">

<h1 id="categoryCount">
0
</h1>

<p>
Categories
</p>

</div>


</div>






<div class="grid">



<div class="box">


<h2>
Upload Design
</h2>


<input id="title"
placeholder="Design title">



<select id="category">


<option>
Logos
</option>


<option>
Flyers
</option>


<option>
Branding
</option>


<option>
DTF
</option>


<option>
Banners
</option>


</select>




<textarea id="description"

placeholder="Description">

</textarea>





<input type="file"

id="designImage">






<button onclick="uploadDesign()">

Upload Design

</button>



</div>







<div class="box">


<h2 id="teamHeading">

Upload Team Member

</h2>




<input id="teamName"

placeholder="Name">



<input id="teamPosition"

placeholder="Position">





<select id="teamCategory">


<option value="CEO">
CEO
</option>


<option value="MD">
MD
</option>


<option value="staff">
Staff
</option>


</select>






<textarea id="teamBio"

placeholder="Bio">

</textarea>






<input type="file"

id="teamImage">





<button onclick="saveTeam()">

Save Member

</button>





<button class="cancel"

id="cancelBtn"

onclick="cancelEdit()"

style="display:none">

Cancel Edit

</button>




</div>




</div>





<h2 style="margin-top:50px">

Team Library

</h2>


<div class="items" id="teamList"></div>






<h2 style="margin-top:50px">

Design Library

</h2>


<div class="items" id="designList"></div>





<h2 style="margin-top:50px">

Client Messages

</h2>


<div class="items" id="messageList"></div>






<h2 style="margin-top:50px">

FAQ Management

</h2>



<div class="box">


<input id="faqQuestion"

placeholder="Question">



<textarea id="faqAnswer"

placeholder="Answer">

</textarea>




<button onclick="addFAQ()">

Add FAQ

</button>


</div>




<div class="items" id="faqList"></div>





<h2 style="margin-top:50px">

Testimonials

</h2>


<div class="items" id="testimonialList"></div>


</div>


<script>


const API="http://localhost:5000";


const token=
localStorage.getItem("adminToken");


let editID=null;



if(!token){

window.location.href="admin-login.html";

}



function logout(){


localStorage.removeItem("adminToken");


window.location.replace(
"admin-login.html"
);


}

async function loadStats(){


const res = await fetch(

API+"/api/stats",

{

headers:{

Authorization:"Bearer "+token

}

}

);



const data = await res.json();



if(data.message==="Invalid token"){

logout();

return;

}



document.getElementById("designCount").innerHTML =
data.designs || 0;


document.getElementById("teamCount").innerHTML =
data.team || 0;


document.getElementById("categoryCount").innerHTML =
data.categories || 0;


}







async function uploadDesign(){



const image =
document.getElementById("designImage").files[0];



if(!image){

alert("Please select an image");

return;

}



const form=new FormData();


form.append(
"title",
document.getElementById("title").value
);


form.append(
"category",
document.getElementById("category").value
);


form.append(
"description",
document.getElementById("description").value
);



form.append(
"image",
image
);





const res=await fetch(

API+"/api/designs",

{

method:"POST",

headers:{

Authorization:"Bearer "+token

},

body:form

}

);



const data=await res.json();



if(data.success){


alert("Design uploaded successfully");


document.getElementById("title").value="";

document.getElementById("description").value="";

document.getElementById("designImage").value="";


loadDesigns();

loadStats();


}

else{


alert(data.message || "Upload failed");


}


}







async function loadDesigns(){


const res=await fetch(

API+"/api/designs"

);


const data=await res.json();



designList.innerHTML="";



data.data.forEach(d=>{


designList.innerHTML+=`


<div class="item">


<img src="${API}/uploads/${d.image}">


<h3>${d.title}</h3>


<p>${d.category}</p>


<p>${d.description || ""}</p>



<button class="delete"

onclick="deleteDesign('${d._id}')">

Delete

</button>



</div>


`;



});


}







async function deleteDesign(id){


await fetch(

API+"/api/designs/"+id,

{

method:"DELETE",

headers:{

Authorization:"Bearer "+token

}

}

);


loadDesigns();

loadStats();


}










async function saveTeam(){



const form=new FormData();



form.append(
"name",
document.getElementById("teamName").value.trim()
);



form.append(
"position",
document.getElementById("teamPosition").value.trim()
);



form.append(
"category",
document.getElementById("teamCategory").value
);



form.append(
"bio",
document.getElementById("teamBio").value.trim()
);



const image =
document.getElementById("teamImage").files[0];



if(image){

form.append(
"image",
image
);

}




let url=API+"/api/team";

let method="POST";



if(editID){


url=API+"/api/team/"+editID;

method="PUT";


}



const res=await fetch(

url,

{

method:method,

headers:{

Authorization:"Bearer "+token

},

body:form

}

);



const data=await res.json();



if(data.success){


alert(
editID ?
"Team updated" :
"Team member added"
);


cancelEdit();

loadTeam();

loadStats();


}


}








async function loadTeam(){


const res=await fetch(

API+"/api/team"

);


const data=await res.json();



teamList.innerHTML="";



data.data.forEach(t=>{


teamList.innerHTML+=`


<div class="item">


<img src="${API}/uploads/${t.image}">


<h3>${t.name}</h3>


<p>${t.position}</p>


<p>${t.category}</p>


<p>${t.bio || ""}</p>



<button class="delete"

onclick="deleteTeam('${t._id}')">

Delete

</button>



</div>


`;


});


}







async function deleteTeam(id){


await fetch(

API+"/api/team/"+id,

{

method:"DELETE",

headers:{

Authorization:"Bearer "+token

}

}

);


loadTeam();

loadStats();


}








function cancelEdit(){


editID=null;


document.getElementById("teamHeading").innerHTML =
"Upload Team Member";


document.getElementById("cancelBtn").style.display =
"none";



teamName.value="";

teamPosition.value="";

teamBio.value="";

teamImage.value="";


}









async function loadMessages(){


const res=await fetch(

API+"/api/messages",

{

headers:{

Authorization:"Bearer "+token

}

}

);



const data=await res.json();



messageList.innerHTML="";



data.data.forEach(m=>{


messageList.innerHTML+=`


<div class="message">


<h3>${m.name}</h3>


<p>${m.email}</p>


<p>${m.subject}</p>


<p>${m.message}</p>




<button class="delete"

onclick="deleteMessage('${m._id}')">

Delete

</button>



</div>


`;


});


}







async function deleteMessage(id){


await fetch(

API+"/api/messages/"+id,

{

method:"DELETE",

headers:{

Authorization:"Bearer "+token

}

}

);


loadMessages();


}









async function addFAQ(){



await fetch(

API+"/api/faqs",

{

method:"POST",

headers:{

"Content-Type":"application/json",

Authorization:"Bearer "+token

},


body:JSON.stringify({

question:
faqQuestion.value,


answer:
faqAnswer.value


})

}

);



faqQuestion.value="";

faqAnswer.value="";


loadFAQ();


}








async function loadFAQ(){



const res=await fetch(

API+"/api/faqs"

);



const data=await res.json();



faqList.innerHTML="";



data.data.forEach(f=>{


faqList.innerHTML+=`


<div class="item">


<h3>${f.question}</h3>


<p>${f.answer}</p>


<button class="delete"

onclick="deleteFAQ('${f._id}')">

Delete

</button>


</div>


`;


});


}







async function deleteFAQ(id){


await fetch(

API+"/api/faqs/"+id,

{

method:"DELETE",

headers:{

Authorization:"Bearer "+token

}

}

);


loadFAQ();


}









async function loadTestimonials(){



const res=await fetch(

API+"/api/testimonials/admin",

{

headers:{

Authorization:"Bearer "+token

}

}

);



const data=await res.json();



testimonialList.innerHTML="";



data.data.forEach(t=>{


testimonialList.innerHTML+=`


<div class="item">


<h3>${t.name}</h3>


<p>${t.message}</p>


<p>

${t.approved ? "Approved":"Pending"}

</p>



<button onclick="approveTestimonial('${t._id}')">

Approve

</button>



<button class="delete"

onclick="deleteTestimonial('${t._id}')">

Delete

</button>


</div>


`;



});


}








async function approveTestimonial(id){


await fetch(

API+"/api/testimonials/"+id,

{

method:"PUT",

headers:{

"Content-Type":"application/json",

Authorization:"Bearer "+token

},

body:JSON.stringify({

approved:true

})

}

);



loadTestimonials();


}







async function deleteTestimonial(id){


await fetch(

API+"/api/testimonials/"+id,

{

method:"DELETE",

headers:{

Authorization:"Bearer "+token

}

}

);



loadTestimonials();


}






loadStats();

loadDesigns();

loadTeam();

loadMessages();

loadFAQ();

loadTestimonials();



</script>


</body>

</html>
