<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GODNECHEZ ADMIN</title>


<style>

:root{

--black:#0B0F14;
--yellow:#0f4cb4;
--red:#E63946;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}


body{

background:#f4f4f4;
color:#111;

}


header{

background:var(--black);
color:white;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}


header button{

background:var(--yellow);

border:none;

padding:12px 20px;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}



.container{

max-width:1200px;

margin:auto;

padding:30px;

}



.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:20px;

margin-bottom:40px;

}



.card,
.box,
.item{

background:white;

padding:20px;

border-radius:20px;

}



.card{

text-align:center;

}



.card h1{

font-size:40px;

color:var(--yellow);

}



.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(350px,1fr));

gap:25px;

}



input,
textarea,
select{

width:100%;

padding:12px;

margin:10px 0;

border:1px solid #ddd;

border-radius:10px;

}


textarea{

height:100px;

}


button{

background:var(--yellow);

border:none;

padding:12px 20px;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}



.delete{

background:var(--red);

color:white;

}


.items{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

margin-top:20px;

}


.item img{

width:100%;

height:200px;

object-fit:cover;

border-radius:10px;

}


</style>

</head>



<body>


<header>

<h2>
GODNECHEZ ADMIN
</h2>


<button onclick="logout()">

Logout

</button>


</header>





<div class="container">



<div class="stats">


<div class="card">

<h1 id="designCount">
0
</h1>

<p>
Designs
</p>

</div>




<div class="card">

<h1 id="teamCount">
0
</h1>

<p>
Team
</p>

</div>




<div class="card">

<h1 id="categoryCount">
0
</h1>

<p>
Categories
</p>

</div>



</div>








<div class="grid">


<div class="box">


<h2>
Upload Design
</h2>


<input id="title" placeholder="Design title">


<select id="category">

<option>Logos</option>

<option>Flyers</option>

<option>Branding</option>

<option>DTF</option>

<option>Banners</option>

</select>



<textarea id="description"
placeholder="Description"></textarea>



<input type="file" id="designImage">



<button onclick="uploadDesign()">

Upload Design

</button>


</div>








<div class="box">


<h2>
Upload Team Member
</h2>



<input id="teamName"
placeholder="Name">


<input id="teamPosition"
placeholder="Position">



<select id="teamCategory">

<option value="CEO">
CEO
</option>


<option value="MD">
MD
</option>


<option value="staff">
Staff
</option>


</select>



<textarea id="teamBio"
placeholder="Bio"></textarea>



<input type="file" id="teamImage">



<button onclick="saveTeam()">

Save Member

</button>


</div>


</div>




<!-- LIBRARIES -->


<h2 style="margin-top:50px">
Team Library
</h2>


<div class="items" id="teamList"></div>





<h2 style="margin-top:50px">
Design Library
</h2>


<div class="items" id="designList"></div>





<h2 style="margin-top:50px">
Client Messages
</h2>


<div class="items" id="messageList"></div>






<h2 style="margin-top:50px">
FAQ Management
</h2>



<div class="box">


<input id="faqQuestion"
placeholder="Question">


<textarea id="faqAnswer"
placeholder="Answer"></textarea>



<button onclick="addFAQ()">

Add FAQ

</button>


</div>


<div class="items" id="faqList"></div>






<h2 style="margin-top:50px">
Testimonials
</h2>


<div class="items" id="testimonialList"></div>






<h2 style="margin-top:50px">
Admin Management
</h2>


<div class="items" id="adminList"></div>








<script>


const API="http://localhost:5000";


const token=localStorage.getItem("adminToken");



if(!token){

window.location.href="admin-login.html";

}







function logout(){

localStorage.removeItem("adminToken");

window.location.href="admin-login.html";

}









async function loadStats(){


const res=await fetch(

API+"/api/stats",

{

headers:{

Authorization:"Bearer "+token

}

}

);



const data=await res.json();



designCount.innerHTML=data.designs || 0;


teamCount.innerHTML=data.team || 0;


categoryCount.innerHTML=data.categories || 0;


}









/*
====================
DESIGNS
====================
*/



async function uploadDesign(){



const file=designImage.files[0];



if(!file){

alert("Select image");

return;

}





const form=new FormData();



form.append("title",title.value);


form.append("category",category.value);


form.append("description",description.value);


form.append("image",file);






const res=await fetch(

API+"/api/designs",

{

method:"POST",

headers:{

Authorization:"Bearer "+token

},

body:form

}

);



const data=await res.json();



if(data.success){


alert("Uploaded");


title.value="";


description.value="";


designImage.value="";


loadDesigns();


loadStats();


}

else{


alert(data.message);


}



}









async function loadDesigns(){


const res=await fetch(

API+"/api/designs"

);


const data=await res.json();



designList.innerHTML="";



data.data.forEach(d=>{


designList.innerHTML+=`


<div class="item">


<img src="${d.image}">


<h3>${d.title}</h3>


<p>${d.category}</p>



<button class="delete"

onclick="deleteDesign('${d._id}')">

Delete

</button>


</div>


`;



});


}









async function deleteDesign(id){


await fetch(

API+"/api/designs/"+id,

{

method:"DELETE",

headers:{

Authorization:"Bearer "+token

}

}

);



loadDesigns();

loadStats();


}









/*
====================
TEAM
====================
*/



async function saveTeam(){


const file=teamImage.files[0];



const form=new FormData();



form.append("name",teamName.value);


form.append("position",teamPosition.value);


form.append("category",teamCategory.value);


form.append("bio",teamBio.value);



if(file){

form.append("image",file);

}




const res=await fetch(

API+"/api/team",

{

method:"POST",

headers:{

Authorization:"Bearer "+token

},

body:form

}

);



const data=await res.json();



if(data.success){


alert("Member saved");


teamName.value="";


teamPosition.value="";


teamBio.value="";


teamImage.value="";


loadTeam();


loadStats();


}


else{


alert(data.message);


}


}








async function loadTeam(){


const res=await fetch(

API+"/api/team"

);



const data=await res.json();



teamList.innerHTML="";



data.data.forEach(t=>{


teamList.innerHTML+=`


<div class="item">


<img src="${t.image}">


<h3>${t.name}</h3>


<p>${t.position}</p>


<p>${t.category}</p>



<button class="delete"

onclick="deleteTeam('${t._id}')">

Delete

</button>


</div>


`;



});


}








async function deleteTeam(id){


await fetch(

API+"/api/team/"+id,

{

method:"DELETE",

headers:{

Authorization:"Bearer "+token

}

}

);



loadTeam();


}



/*
====================
FAQ
====================
*/



async function addFAQ(){



const res=await fetch(

API+"/api/faqs",

{

method:"POST",

headers:{

"Content-Type":"application/json",

Authorization:"Bearer "+token

},

body:JSON.stringify({

question:faqQuestion.value,

answer:faqAnswer.value

})

}

);



const data=await res.json();



if(data.success){


faqQuestion.value="";


faqAnswer.value="";


loadFAQ();


}

else{


alert(data.message);


}


}








async function loadFAQ(){


const res=await fetch(

API+"/api/faqs"

);



const data=await res.json();



faqList.innerHTML="";



data.data.forEach(f=>{


faqList.innerHTML+=`


<div class="item">


<h3>${f.question}</h3>


<p>${f.answer}</p>



<button class="delete"

onclick="deleteFAQ('${f._id}')">

Delete

</button>


</div>


`;



});


}







async function deleteFAQ(id){


await fetch(

API+"/api/faqs/"+id,

{

method:"DELETE",

headers:{

Authorization:"Bearer "+token

}

}

);



loadFAQ();


}












/*
====================
MESSAGES
====================
*/



async function loadMessages(){


const res=await fetch(

API+"/api/messages",

{

headers:{

Authorization:"Bearer "+token

}

}

);



const data=await res.json();



messageList.innerHTML="";



data.data.forEach(m=>{


messageList.innerHTML+=`


<div class="item">


<h3>${m.name}</h3>


<p>${m.email}</p>


<p>${m.subject}</p>


<p>${m.message}</p>



<button class="delete"

onclick="deleteMessage('${m._id}')">

Delete

</button>


</div>


`;



});


}









async function deleteMessage(id){


await fetch(

API+"/api/messages/"+id,

{

method:"DELETE",

headers:{

Authorization:"Bearer "+token

}

}

);



loadMessages();


}












/*
====================
TESTIMONIALS
====================
*/



async function loadTestimonials(){



const res=await fetch(

API+"/api/testimonials/admin",

{

headers:{

Authorization:"Bearer "+token

}

}

);



const data=await res.json();



testimonialList.innerHTML="";



data.data.forEach(t=>{


testimonialList.innerHTML+=`


<div class="item">


<h3>${t.name}</h3>


<p>${t.message}</p>


<p>

${t.approved ? "Approved":"Pending"}

</p>




<button onclick="approveTestimonial('${t._id}')">

Approve

</button>




<button class="delete"

onclick="deleteTestimonial('${t._id}')">

Delete

</button>



</div>


`;



});


}








async function approveTestimonial(id){



await fetch(

API+"/api/testimonials/"+id,

{

method:"PUT",

headers:{

"Content-Type":"application/json",

Authorization:"Bearer "+token

},

body:JSON.stringify({

approved:true

})

}

);



loadTestimonials();


}








async function deleteTestimonial(id){


await fetch(

API+"/api/testimonials/"+id,

{

method:"DELETE",

headers:{

Authorization:"Bearer "+token

}

}

);



loadTestimonials();


}


/*
====================
ADMIN MANAGEMENT
====================
*/



async function loadAdmins(){



const res=await fetch(

API+"/api/admin/pending",

{

headers:{

Authorization:"Bearer "+token

}

}

);



const data=await res.json();



adminList.innerHTML="";



if(!data.data || data.data.length===0){


adminList.innerHTML=`

<div class="item">

<p>No pending admins</p>

</div>

`;

return;


}





data.data.forEach(admin=>{


adminList.innerHTML+=`


<div class="item">


<h3>${admin.username}</h3>


<p>${admin.email}</p>




<button onclick="approveAdmin('${admin._id}')">

Approve

</button>




<button class="delete"

onclick="rejectAdmin('${admin._id}')">

Reject

</button>



</div>


`;



});


}








async function approveAdmin(id){



await fetch(

API+"/api/admin/approve/"+id,

{

method:"PUT",

headers:{

Authorization:"Bearer "+token

}

}

);



loadAdmins();


}








async function rejectAdmin(id){



await fetch(

API+"/api/admin/reject/"+id,

{

method:"DELETE",

headers:{

Authorization:"Bearer "+token

}

}

);



loadAdmins();


}









/*
====================
LOAD ALL DATA
====================
*/



loadStats();


loadDesigns();


loadTeam();


loadMessages();


loadFAQ();


loadTestimonials();


loadAdmins();




</script>



</div>


</body>

</html>
