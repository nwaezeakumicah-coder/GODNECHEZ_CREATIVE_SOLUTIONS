<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Client Testimonials | GODNECHEZ</title>


<style>


:root{

--blue:#0A3D91;

--navy:#061B3A;

--white:#FFFFFF;

--yellow:#FFD400;

--red:#E63946;

--gray:#6B7280;

}


*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}


body{

background:var(--white);

color:var(--navy);

}


/* NAVBAR */


header{

position:fixed;
top:0;
width:100%;

background:rgba(10,61,145,.95);

backdrop-filter:blur(15px);

border-bottom:1px solid rgba(255,255,255,.2);

z-index:1000;

}



.navbar{

max-width:1200px;

margin:auto;

padding:15px 20px;

display:flex;

justify-content:space-between;

align-items:center;

}



/* BRAND */


.brand{

display:flex;

align-items:center;

gap:12px;

}



.brand img{

width:45px;

height:45px;

object-fit:contain;

}



.logo-text{

display:flex;

flex-direction:column;

font-size:20px;

font-weight:900;

line-height:1;

color:white;

}



.logo-text span{

font-size:11px;

letter-spacing:1px;

color:var(--yellow);

}





/* NAV LINKS */


.nav{

display:flex;

align-items:center;

gap:22px;

}



.nav a{

text-decoration:none;

color:white;

font-weight:bold;

font-size:14px;

}



.nav a:hover{

color:var(--yellow);

}




.admin-link{

background:var(--yellow);

color:var(--navy)!important;

padding:10px 18px;

border-radius:30px;

}



.admin-link:hover{

background:var(--red);

color:white!important;

}




.menu{

display:none;

font-size:28px;

cursor:pointer;

color:white;

}


/* HERO */


.hero{

background:#f5f8ff;

padding:120px 20px 90px;

text-align:center;

}



.hero h1{

font-size:3rem;

}



.hero span{

color:var(--blue);

}

/* FORM */


.container{

max-width:600px;

margin:auto;

padding:60px 20px;

}



.box{

background:#f5f8ff;

padding:30px;

border-radius:20px;

border-top:5px solid var(--yellow);

}



.box h2{

margin-bottom:20px;

color:var(--navy);

}



input,
textarea{

width:100%;

padding:14px;

margin:10px 0;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;

}



input:focus,
textarea:focus{

outline:2px solid var(--blue);

}



textarea{

height:150px;

resize:none;

}





button{

background:var(--yellow);

color:var(--navy);

border:none;

padding:14px 25px;

border-radius:25px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}



button:hover{

transform:scale(1.03);

background:var(--red);

color:white;

}



/* FOOTER */


footer{

background:var(--navy);

color:white;

padding:40px;

text-align:center;

}






@media(max-width:768px){


.nav{

position:fixed;

top:70px;

right:-100%;

width:250px;

height:100vh;

background:var(--blue);

display:flex;

flex-direction:column;

padding:30px;

gap:25px;

transition:.4s;

}



.nav a{

color:white;

}



.nav.show{

right:0;

}



.menu{

display:block;

}


}

</style>


</head>


<body>




<header>

<div class="navbar">


<div class="brand">

<img src="logo.png" alt="GODNECHEZ Logo">


<div class="logo-text">

GODNECHEZ

<span>

CREATIVE SOLUTIONS

</span>

</div>


</div>




<div class="nav" id="nav">


<a href="index.html">
Home
</a>


<a href="portfolio.html">
Portfolio
</a>


<a href="services.html">
Services
</a>


<a href="about.html">
About
</a>


<a href="faq.html">
FAQ
</a>


<a href="testimonials.html">
Testimonials
</a>


<a href="contact.html">
Contact
</a>



<a href="admin-login.html" class="admin-link">

👤 Admin Login

</a>



</div>





<div class="menu" onclick="toggleMenu()">

☰

</div>



</div>

</header>



<section class="hero">


<h1>

Share Your 

<span>
Experience
</span>

</h1>


<p>

Your feedback helps us grow.

</p>


</section>








<div class="container">


<div class="box">



<h2>

Leave A Testimonial

</h2>




<input

id="testimonialName"

type="text"

placeholder="Your Name"

>




<textarea

id="testimonialMessage"

placeholder="Your Experience">

</textarea>





<button onclick="sendTestimonial()">

Submit Review

</button>




</div>


</div>









<footer>


© 2026 GODNECHEZ CREATIVE SOLUTIONS


</footer>







<script>


const API="http://localhost:5000";



function toggleMenu(){


document

.getElementById("nav")

.classList.toggle("show");


}





async function sendTestimonial(){



const nameValue = 

document.getElementById(
"testimonialName"
).value;



const messageValue = 

document.getElementById(
"testimonialMessage"
).value;





if(

nameValue.trim()==="" ||

messageValue.trim()===""

){

alert("Please fill all fields");

return;

}





try{



const res = await fetch(

API + "/api/testimonials",

{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


name:nameValue,


message:messageValue


})


}

);




const result = await res.json();




if(result.success){


alert(

"Thank you! Your review is awaiting approval."

);



document.getElementById(
"testimonialName"
).value="";



document.getElementById(
"testimonialMessage"
).value="";



}

else{


alert(
"Submission failed"
);


}



}

catch(error){


console.log(error);


alert(

"Server connection error"

);


}



}



</script>



</body>

</html>
