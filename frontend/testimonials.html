<style>


:root{

--yellow:#FFD400;

}


*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}


body{

background:#fff;

color:#111;

}


/* NAVBAR */


header{

position:fixed;
top:0;
width:100%;

background:rgba(255,255,255,.95);

backdrop-filter:blur(15px);

border-bottom:1px solid #eee;

z-index:1000;

}



.navbar{

max-width:1200px;

margin:auto;

padding:15px 20px;

display:flex;

justify-content:space-between;

align-items:center;

}



/* BRAND */


.brand{

display:flex;

align-items:center;

gap:12px;

}



.brand img{

width:45px;

height:45px;

object-fit:contain;

}



.logo-text{

display:flex;

flex-direction:column;

font-size:20px;

font-weight:900;

line-height:1;

}



.logo-text span{

font-size:11px;

letter-spacing:1px;

color:var(--yellow);

}





/* NAV LINKS */


.nav{

display:flex;

align-items:center;

gap:22px;

}



.nav a{

text-decoration:none;

color:#111;

font-weight:bold;

font-size:14px;

}



.nav a:hover{

color:#E63946;

}




.admin-link{

background:var(--yellow);

padding:10px 18px;

border-radius:30px;

}




.menu{

display:none;

font-size:28px;

cursor:pointer;

}

/* HERO */


.hero{

background:#f5f5f5;

padding:90px 20px;

text-align:center;

}



.hero h1{

font-size:3rem;

}



.hero span{

color:var(--yellow);

}




/* FORM */


.container{

max-width:600px;

margin:auto;

padding:60px 20px;

}



.box{

background:#f5f5f5;

padding:30px;

border-radius:20px;

}



.box h2{

margin-bottom:20px;

}



input,
textarea{

width:100%;

padding:14px;

margin:10px 0;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;

}



textarea{

height:150px;

resize:none;

}



button{

background:var(--yellow);

border:none;

padding:14px 25px;

border-radius:25px;

font-weight:bold;

cursor:pointer;

}



button:hover{

transform:scale(1.03);

}



/* FOOTER */


footer{

background:#171B24;

color:white;

padding:40px;

text-align:center;

}





@media(max-width:768px){


.nav{

display:none;

}



.menu{

display:block;

}


}

</style>


</head>


<body>




<header>

<div class="navbar">


<div class="brand">

<img src="logo.png" alt="GODNECHEZ Logo">


<div class="logo-text">

GODNECHEZ

<span>

</span>

</div>


</div>




<div class="nav" id="nav">


<a href="index.html">

</a>



</div>





<div class="menu" onclick="toggleMenu()">

☰

</div>



</div>

</header>







<section class="hero">


<h1>

Share Your 

<span>
Experience
</span>

</h1>


<p>

Your feedback helps us grow.

</p>


</section>








<div class="container">


<div class="box">



<h2>

Leave A Testimonial

</h2>




<input

id="testimonialName"

type="text"

placeholder="Your Name"

>




<textarea

id="testimonialMessage"

placeholder="Your Experience">

</textarea>





<button onclick="sendTestimonial()">

Submit Review

</button>




</div>


</div>









<footer>


© 2026 GODNECHEZ CREATIVE SOLUTIONS


</footer>







<script>


const API="http://localhost:5000";




async function sendTestimonial(){



const nameValue = 

document.getElementById(
"testimonialName"
).value;



const messageValue = 

document.getElementById(
"testimonialMessage"
).value;





if(

nameValue.trim()==="" ||

messageValue.trim()===""

){

alert("Please fill all fields");

return;

}





try{



const res = await fetch(

API + "/api/testimonials",

{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


name:nameValue,


message:messageValue


})


}

);




const result = await res.json();




if(result.success){


alert(

"Thank you! Your review is awaiting approval."

);



document.getElementById(
"testimonialName"
).value="";



document.getElementById(
"testimonialMessage"
).value="";



}

else{


alert(
"Submission failed"
);


}



}

catch(error){


console.log(error);


alert(

"Server connection error"

);


}



}



</script>
