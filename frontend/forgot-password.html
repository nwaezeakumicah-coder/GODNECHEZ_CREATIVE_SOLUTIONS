<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>


<style>

body{

font-family:Arial;

background:#0B0F14;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}


.box{

background:white;

padding:30px;

width:350px;

border-radius:15px;

}


input{

width:100%;

padding:12px;

margin:10px 0;

}



button{

width:100%;

padding:12px;

background--yellow:#0f4cb4;
border:none;

font-weight:bold;

cursor:pointer;

}


</style>


</head>



<body>


<div class="box">


<h2>Forgot Password</h2>


<input 
id="email" 
placeholder="Admin Email">



<button onclick="sendOTP()">

Send OTP

</button>


<p id="message"></p>


</div>








<script>


const API="https://godnechez-creative-solutions.onrender.com/";





async function sendOTP(){



const res = await fetch(

API+"/api/admin/forgot-password",

{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

email:email.value

})


}

);





const data = await res.json();





if(data.success){



localStorage.setItem(

"resetEmail",

email.value

);



window.location.href="verify-otp.html";



}

else{


message.innerHTML=data.message;


}



}




</script>


</body>


</html>
