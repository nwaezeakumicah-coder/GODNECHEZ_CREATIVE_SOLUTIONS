<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GODNECHEZ CREATIVE</title>


<style>


:root{

--black:#0B0F14;
--yellow:#FFD400;
--blue:#38BDF8;
--white:#ffffff;
--gray:#6B7280;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}


body{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

background:

radial-gradient(circle at top right,
rgba(56,189,248,.18),
transparent 35%),

linear-gradient(
135deg,
#ffffff,
#f5f5f5
);

color:var(--black);

}






/* animated background */


body::before{


content:"";

position:absolute;

width:500px;

height:500px;

background:var(--yellow);

filter:blur(180px);

opacity:.25;

top:-100px;

left:-100px;

animation:moveGlow 7s infinite alternate;


}



@keyframes moveGlow{


from{

transform:translate(0,0);

}


to{

transform:translate(200px,150px);

}


}








.container{


position:relative;

z-index:5;

text-align:center;

animation:intro 1.5s ease;


}





@keyframes intro{


from{

opacity:0;

transform:translateY(70px);

}


to{

opacity:1;

transform:translateY(0);

}


}









/* LOGO */


.logo-box{


width:350px;

height:350px;

margin:auto;

border-radius:50%;

background:white;

padding:15px;

position:relative;

box-shadow:

0 30px 70px rgba(0,0,0,.15);


animation:float 5s infinite;


}




.logo-box::before{


content:"";

position:absolute;

inset:-8px;

border-radius:50%;


background:

linear-gradient(
45deg,
var(--yellow),
var(--blue),
transparent
);


z-index:-1;

animation:rotate 5s linear infinite;


}




@keyframes rotate{


100%{

transform:rotate(360deg);

}

}




.logo-box img{


width:100%;

height:100%;

object-fit:contain;


}





@keyframes float{


50%{

transform:translateY(-20px);

}


}









.brand{


margin-top:40px;

font-size:3.5rem;

font-weight:1000;

letter-spacing:8px;


}





.brand span{


color:var(--yellow);


}









.tagline{


margin-top:20px;

font-size:18px;

color:var(--gray);


animation:text 2s ease;


}



@keyframes text{


from{

opacity:0;

letter-spacing:15px;

}


to{

opacity:1;

letter-spacing:0;

}


}









.enter{


margin-top:40px;

display:inline-block;


padding:18px 55px;


border-radius:50px;


background:var(--black);


color:white;


text-decoration:none;


font-weight:900;


transition:.4s;


box-shadow:

0 10px 30px rgba(0,0,0,.2);


}




.enter:hover{


transform:scale(1.1);


background:var(--yellow);

color:black;


}









/* particles */


.particle{


position:absolute;


width:8px;

height:8px;


background:var(--blue);


border-radius:50%;


opacity:.5;


animation:rise linear infinite;


}



@keyframes rise{


from{

transform:translateY(100vh);

}


to{

transform:translateY(-20vh);

}


}









@media(max-width:600px){


.logo-box{


width:240px;

height:240px;


}



.brand{


font-size:2rem;

letter-spacing:3px;


}



}



</style>


</head>



<body>





<div class="container">



<div class="logo-box">


<img src="images/logo.png">


</div>





<h1 class="brand">


GODNECHEZ

<span>

CREATIVE

</span>


</h1>





<p class="tagline">


Designing ideas. Building brands. Creating impact.


</p>





<a href="index.html" class="enter">

ENTER WEBSITE

</a>


</div>









<script>


for(let i=0;i<50;i++){


let p=document.createElement("div");


p.className="particle";


p.style.left=Math.random()*100+"vw";


p.style.animationDuration=

(5+Math.random()*8)+"s";


p.style.animationDelay=

Math.random()*5+"s";



document.body.appendChild(p);



}


</script>





</body>

</html>
