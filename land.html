<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GODNECHEZ CREATIVE</title>


<style>


:root{

--blue:#0A3D91;
--navy:#061B3A;
--white:#FFFFFF;
--yellow:#FFD400;
--red:#E63946;
--gray:#D1D5DB;

}



*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

}



body{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

background:

radial-gradient(

circle at top right,

rgba(255,212,0,.18),

transparent 35%

),

linear-gradient(

135deg,

var(--navy),

var(--blue)

);


color:var(--white);

}





/* ANIMATED BACKGROUND */


body::before{


content:"";

position:absolute;

width:500px;

height:500px;

background:var(--yellow);

filter:blur(180px);

opacity:.18;

top:-100px;

left:-100px;

animation:moveGlow 20s infinite alternate;


}



@keyframes moveGlow{


from{

transform:translate(0,0);

}


to{

transform:translate(200px,150px);

}


}





.container{


position:relative;

z-index:5;

text-align:center;

animation:intro 5s ease;


}





@keyframes intro{


from{

opacity:0;

transform:translateY(70px);

}


to{

opacity:1;

transform:translateY(0);

}


}

/* LOGO */


.logo-box{


width:350px;

height:350px;

margin:auto;

border-radius:50%;

background:var(--red);

padding:15px;

position:relative;

box-shadow:

0 30px 70px rgba(0,0,0,.35);


animation:float 6s infinite;


}




.logo-box::before{


content:"";

position:absolute;

inset:-5px;

border-radius:10%;


background:

linear-gradient(

50deg,

var(--yellow),

var(--red),

var(--blue)

);


z-index:-1;

animation:rotate 5s linear infinite;


}



@keyframes rotate{


100%{

transform:rotate(360deg);

}

}



.logo-box img{


width:100%;

height:100%;

object-fit:contain;


}





@keyframes float{


50%{

transform:translateY(-20px);

}


}





.brand{


margin-top:40px;

font-size:4rem;

font-weight:1000;

/* letter-spacing:2px; */

color:var(--white);


}





.brand span{


color:var(--yellow);
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;


}









.tagline{


margin-top:20px;

font-size:18px;
font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;

color:var(--gray);
font-weight: 200px;


animation:text 10s ease;


}



@keyframes text{


from{

opacity:0;

letter-spacing:2px;

}


to{

opacity:1;

letter-spacing:0;

}


}









.enter{


margin-top:40px;

display:inline-block;


padding:18px 55px;


border-radius:50px;


background:var(--yellow);


color:var(--navy);


text-decoration:none;


font-weight:900;


transition:.4s;


box-shadow:

0 10px 30px rgba(0,0,0,.3);


}




.enter:hover{


transform:scale(1.1);


background:var(--white);

color:var(--blue);


}

/* PARTICLES */


.particle{


position:absolute;


width:8px;

height:8px;


background:var(--yellow);


border-radius:50%;


opacity:.5;


animation:rise linear infinite;


}



@keyframes rise{


from{

transform:translateY(100vh);

}


to{

transform:translateY(-20vh);

}


}









@media(max-width:600px){


.logo-box{


width:240px;

height:240px;


}



.brand{


font-size:2rem;

/* letter-spacing:1px; */


}



.tagline{

font-size:15px;

padding:0 20px;

}



.enter{

padding:15px 40px;

}



}



</style>


</head>



<body>





<div class="container">



<div class="logo-box">


<img src="images/Untitled-1.png" alt="">


</div>





<h1 class="brand">


GODNECHEZ

<span>

CREATIVE SOLUTIONS

</span>




</h1>





<p class="tagline" style="font-weight: 200px;">


iDESIGN. iPRINT. iBRAND SERVICE. iTEACH.


</p>
<br> <br>
<p style="font-style: italic; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">Designing your desire</p>





<a href="index.html" class="enter">

ENTER WEBSITE

</a>


</div>

<script>


for(let i=0;i<50;i++){


let p=document.createElement("div");


p.className="particle";


p.style.left=Math.random()*100+"vw";


p.style.animationDuration=

(5+Math.random()*10)+"s";


p.style.animationDelay=

Math.random()*5+"s";



document.body.appendChild(p);



}


</script>





</body>

</html>
