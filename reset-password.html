<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#0B0F14;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
}

.box{
    background:white;
    padding:30px;
    width:350px;
    border-radius:15px;
    box-sizing:border-box;
}

h2{
    margin-top:0;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#0f4cb4;
    color:white;
    border:none;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    opacity:.9;
}

#message{
    margin-top:15px;
    text-align:center;
}

</style>

</head>

<body>

<div class="box">

<h2>Reset Password</h2>

<input
id="email"
type="email"
placeholder="Admin Email">

<input
id="otp"
placeholder="Enter OTP">

<input
id="password"
type="password"
placeholder="New Password">

<button onclick="verifyOTP()">
Verify OTP
</button>

<button onclick="resetPassword()">
Change Password
</button>

<p id="message"></p>

</div>

<script>

const API = "https://godnechez-creative-solutions.onrender.com";

async function verifyOTP(){

    if(!email.value || !otp.value){

        message.innerHTML = "Enter email and OTP";
        return;

    }

    try{

        const res = await fetch(
            `${API}/api/admin/verify-otp`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    email:email.value,
                    otp:otp.value
                })
            }
        );

        const data = await res.json();

        message.innerHTML = data.message;

    }

    catch(error){

        message.innerHTML = "Unable to connect to server.";

    }

}

async function resetPassword(){

    if(
        !email.value ||
        !otp.value ||
        !password.value
    ){

        message.innerHTML = "Fill all fields";
        return;

    }

    try{

        const res = await fetch(
            `${API}/api/admin/reset-password`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    email:email.value,
                    otp:otp.value,
                    password:password.value
                })
            }
        );

        const data = await res.json();

        message.innerHTML = data.message;

        if(data.success){

            setTimeout(()=>{

                window.location.href = "admin-login.html";

            },1500);

        }

    }

    catch(error){

        message.innerHTML = "Unable to connect to server.";

    }

}

</script>

</body>

</html>
