<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GODNECHEZ ADMIN DASHBOARD</title>


<style>

:root{

--blue:#0f4cb4;
--yellow:#FFD400;
--red:#E63946;
--dark:#061B3A;
--white:#ffffff;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}



body{

background:#f4f6fb;

color:#111;

}



header{

background:var(--dark);

color:white;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

position:sticky;

top:0;

z-index:10;

}



header h2{

font-size:22px;

}



header button{

background:var(--yellow);

border:none;

padding:12px 20px;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}



.container{

max-width:1200px;

margin:auto;

padding:30px;

}




.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:20px;

margin-bottom:30px;

}



.card{

background:white;

padding:25px;

border-radius:20px;

text-align:center;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}



.card h1{

font-size:40px;

color:var(--blue);

}



.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

gap:25px;

}



.box{

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}



.box h2{

margin-bottom:15px;

color:var(--dark);

}



input,
textarea,
select{

width:100%;

padding:12px;

margin:8px 0;

border:1px solid #ddd;

border-radius:10px;

}



textarea{

height:100px;

resize:none;

}



button{

background:var(--yellow);

border:none;

padding:12px 20px;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}



.delete{

background:var(--red);

color:white;

}



.items{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

margin-top:20px;

}



.item{

background:white;

padding:20px;

border-radius:20px;

box-shadow:0 10px 20px rgba(0,0,0,.08);

}



.item img{

width:100%;

height:200px;

object-fit:cover;

border-radius:10px;

}



.section-title{

margin:40px 0 15px;

color:var(--dark);

}



</style>


</head>


<body>



<header>


<h2>
GODNECHEZ ADMIN
</h2>


<button onclick="logout()">

Logout

</button>


</header>



<div class="container">



<div class="stats">


<div class="card">

<h1 id="designCount">
0
</h1>

<p>
Designs
</p>

</div>




<div class="card">

<h1 id="teamCount">
0
</h1>

<p>
Team
</p>

</div>




<div class="card">

<h1 id="categoryCount">
0
</h1>

<p>
Categories
</p>

</div>



</div>




<div class="grid">



<div class="box">


<h2>
Upload Design
</h2>



<input id="title" placeholder="Design title">



<select id="category">

<option>Logos</option>

<option>Flyers</option>

<option>Branding</option>

<option>DTF</option>

<option>Banners</option>

</select>



<textarea id="description" placeholder="Description"></textarea>



<input type="file" id="designImage">



<button onclick="uploadDesign()">

Upload Design

</button>



</div>





<div class="box">


<h2>
Upload Team Member
</h2>



<input id="teamName" placeholder="Name">



<input id="teamPosition" placeholder="Position">



<select id="teamCategory">

<option value="CEO">
CEO
</option>


<option value="MD">
MD
</option>


<option value="staff">
Staff
</option>


</select>



<textarea id="teamBio" placeholder="Bio"></textarea>



<input type="file" id="teamImage">



<button onclick="saveTeam()">

Save Member

</button>



</div>




</div>
<!-- DESIGN LIST -->

<h2 class="section-title">

Uploaded Designs

</h2>


<div class="items" id="designList">

</div>





<!-- TEAM LIST -->


<h2 class="section-title">

Team Members

</h2>


<div class="items" id="teamList">

</div>






<!-- FAQ -->


<div class="box" style="margin-top:40px;">


<h2>

Add FAQ

</h2>


<input 
id="faqQuestion"
placeholder="Question">


<textarea 
id="faqAnswer"
placeholder="Answer">
</textarea>



<button onclick="addFAQ()">

Add FAQ

</button>



</div>



<h2 class="section-title">

FAQ List

</h2>


<div class="items" id="faqList">

</div>








<!-- MESSAGES -->


<h2 class="section-title">

Client Messages

</h2>


<div class="items" id="messageList">

</div>








<!-- TESTIMONIALS -->


<h2 class="section-title">

Testimonials

</h2>



<div class="items" id="testimonialList">

</div>








<!-- ADMIN APPROVAL -->


<h2 class="section-title">

Pending Admin Accounts

</h2>



<div class="items" id="adminList">

</div>



</div>



<script>


const API = 

"https://godnechez-creative-solutions.onrender.com";



const token = localStorage.getItem(
"adminToken"
);



if(!token){

window.location.href="admin-login.html";

}





function logout(){

localStorage.removeItem(
"adminToken"
);

window.location.href="admin-login.html";

}





/*
=====================
STATS
=====================
*/


async function loadStats(){


try{


const res = await fetch(

API + "/api/stats",

{

headers:{

Authorization:

"Bearer " + token

}

}

);



const data = await res.json();



designCount.innerHTML =
data.designs || 0;



teamCount.innerHTML =
data.team || 0;



categoryCount.innerHTML =
data.categories || 0;



}

catch(err){

console.log(err);

}


}

/*
=====================
DESIGNS
=====================
*/


async function uploadDesign(){


const file = designImage.files[0];


if(!file){

alert("Select image");

return;

}



const form = new FormData();


form.append(
"title",
title.value
);


form.append(
"category",
category.value
);


form.append(
"description",
description.value
);


form.append(
"image",
file
);





try{


const res = await fetch(

API + "/api/designs",

{

method:"POST",

headers:{

Authorization:

"Bearer " + token

},

body:form

}

);



const data = await res.json();



if(data.success){


alert("Design uploaded");



title.value="";

description.value="";

designImage.value="";



loadDesigns();

loadStats();


}

else{


alert(
data.message || "Upload failed"
);


}



}

catch(err){


console.log(err);


alert("Server error");


}



}








async function loadDesigns(){


try{


const res = await fetch(

API + "/api/designs"

);



const data = await res.json();



designList.innerHTML="";




data.data.forEach(design=>{



designList.innerHTML += `



<div class="item">


<img src="${design.image}">


<h3>

${design.title}

</h3>



<p>

${design.category}

</p>



<p>

${design.description || ""}

</p>



<button

class="delete"

onclick="deleteDesign('${design._id}')">


Delete


</button>



</div>


`;



});



}

catch(err){


console.log(err);


}



}









async function deleteDesign(id){



const res = await fetch(

API + "/api/designs/" + id,

{

method:"DELETE",

headers:{

Authorization:

"Bearer " + token

}

}

);



const data = await res.json();



if(data.success){


loadDesigns();

loadStats();


}


}

/*
=====================
TEAM
=====================
*/


async function saveTeam(){


const file = teamImage.files[0];


const form = new FormData();


form.append(
"name",
teamName.value
);


form.append(
"position",
teamPosition.value
);



form.append(
"category",
teamCategory.value
);



form.append(
"bio",
teamBio.value
);



if(file){

form.append(
"image",
file
);

}




try{


const res = await fetch(

API + "/api/team",

{

method:"POST",

headers:{

Authorization:

"Bearer " + token

},

body:form

}

);



const data = await res.json();



if(data.success){


alert("Team member saved");



teamName.value="";

teamPosition.value="";

teamBio.value="";

teamImage.value="";



loadTeam();

loadStats();


}

else{


alert(

data.message || "Failed"

);


}



}

catch(err){


console.log(err);


alert("Server error");


}


}









async function loadTeam(){


try{


const res = await fetch(

API + "/api/team"

);



const data = await res.json();



teamList.innerHTML="";



data.data.forEach(member=>{



teamList.innerHTML += `



<div class="item">


${member.image ? 

`<img src="${member.image}">`

:

""}



<h3>

${member.name}

</h3>



<p>

${member.position}

</p>



<p>

${member.category}

</p>



<button

class="delete"

onclick="deleteTeam('${member._id}')">


Delete


</button>



</div>



`;



});



}

catch(err){


console.log(err);


}



}








async function deleteTeam(id){


const res = await fetch(

API + "/api/team/" + id,

{

method:"DELETE",

headers:{

Authorization:

"Bearer " + token

}

}

);



const data = await res.json();



if(data.success){


loadTeam();

loadStats();


}



}

/*
=====================
FAQ
=====================
*/


async function addFAQ(){


if(!faqQuestion.value || !faqAnswer.value){


alert("Fill all fields");

return;


}



try{


const res = await fetch(

API + "/api/faqs",

{

method:"POST",

headers:{

"Content-Type":"application/json",

Authorization:

"Bearer " + token

},

body:JSON.stringify({

question:faqQuestion.value,

answer:faqAnswer.value

})

}

);



const data = await res.json();



if(data.success){


alert("FAQ added");



faqQuestion.value="";

faqAnswer.value="";



loadFAQ();


}

else{


alert(

data.message || "Failed"

);


}


}

catch(err){


console.log(err);


}



}








async function loadFAQ(){



try{


const res = await fetch(

API + "/api/faqs"

);



const data = await res.json();



faqList.innerHTML="";



data.data.forEach(faq=>{



faqList.innerHTML += `



<div class="item">


<h3>

${faq.question}

</h3>



<p>

${faq.answer}

</p>




<button

class="delete"

onclick="deleteFAQ('${faq._id}')">


Delete


</button>



</div>



`;



});



}

catch(err){


console.log(err);


}


}








async function deleteFAQ(id){



const res = await fetch(

API + "/api/faqs/" + id,

{

method:"DELETE",

headers:{

Authorization:

"Bearer " + token

}

}

);



const data = await res.json();



if(data.success){


loadFAQ();


}



}

/*
=====================
MESSAGES
=====================
*/


async function loadMessages(){


try{


const res = await fetch(

API + "/api/messages",

{

headers:{

Authorization:

"Bearer " + token

}

}

);



const data = await res.json();



messageList.innerHTML="";



data.data.forEach(msg=>{



messageList.innerHTML += `



<div class="item">


<h3>

${msg.name}

</h3>



<p>

${msg.email}

</p>



<p>

${msg.subject || ""}

</p>



<p>

${msg.message}

</p>




<button

class="delete"

onclick="deleteMessage('${msg._id}')">


Delete


</button>



</div>



`;



});



}

catch(err){


console.log(err);


}



}








async function deleteMessage(id){



await fetch(

API + "/api/messages/" + id,

{

method:"DELETE",

headers:{

Authorization:

"Bearer " + token

}

}

);



loadMessages();


}









/*
=====================
TESTIMONIALS
=====================
*/



async function loadTestimonials(){


try{


const res = await fetch(

API + "/api/testimonials/admin",

{

headers:{

Authorization:

"Bearer " + token

}

}

);



const data = await res.json();



testimonialList.innerHTML="";



data.data.forEach(test=>{



testimonialList.innerHTML += `



<div class="item">


<h3>

${test.name}

</h3>



<p>

${test.message}

</p>



<p>

Status:

${test.approved ? "Approved" : "Pending"}

</p>





<button

onclick="approveTestimonial('${test._id}')">


Approve


</button>





<button

class="delete"

onclick="deleteTestimonial('${test._id}')">


Delete


</button>



</div>



`;



});



}

catch(err){


console.log(err);


}



}








async function approveTestimonial(id){



await fetch(

API + "/api/testimonials/" + id,

{

method:"PUT",

headers:{

"Content-Type":"application/json",

Authorization:

"Bearer " + token

},

body:JSON.stringify({

approved:true

})

}

);



loadTestimonials();



}








async function deleteTestimonial(id){



await fetch(

API + "/api/testimonials/" + id,

{

method:"DELETE",

headers:{

Authorization:

"Bearer " + token

}

}

);



loadTestimonials();



}

/*
=====================
ADMIN MANAGEMENT
=====================
*/


async function loadAdmins(){


try{


const res = await fetch(

API + "/api/admin/pending",

{

headers:{

Authorization:

"Bearer " + token

}

}

);



const data = await res.json();



adminList.innerHTML="";




if(!data.data || data.data.length===0){


adminList.innerHTML=`

<div class="item">

<p>

No pending admin accounts

</p>

</div>

`;


return;


}




data.data.forEach(admin=>{



adminList.innerHTML += `



<div class="item">


<h3>

${admin.username}

</h3>



<p>

${admin.email}

</p>



<p>

${admin.approved ? "Approved" : "Pending"}

</p>




<button

onclick="approveAdmin('${admin._id}')">


Approve


</button>





<button

class="delete"

onclick="rejectAdmin('${admin._id}')">


Reject


</button>



</div>



`;



});



}

catch(err){


console.log(err);


}



}









async function approveAdmin(id){



const res = await fetch(

API + "/api/admin/approve/" + id,

{

method:"PUT",

headers:{

Authorization:

"Bearer " + token

}

}

);



const data = await res.json();



if(data.success){


loadAdmins();


}



}









async function rejectAdmin(id){



const res = await fetch(

API + "/api/admin/reject/" + id,

{

method:"DELETE",

headers:{

Authorization:

"Bearer " + token

}

}

);



const data = await res.json();



if(data.success){


loadAdmins();


}



}









/*
=====================
AUTO LOAD DATA
=====================
*/


loadStats();


loadDesigns();


loadTeam();


loadFAQ();


loadMessages();


loadTestimonials();


loadAdmins();



</script>


</body>

</html>
