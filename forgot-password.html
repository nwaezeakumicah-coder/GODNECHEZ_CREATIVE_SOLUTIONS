<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | GODNECHEZ CREATIVE</title>


<style>

:root{

--blue:#0f4cb4;
--yellow:#FFD400;
--red:#E63946;
--dark:#0B0F14;
--white:#ffffff;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}


body{

background:linear-gradient(
135deg,
#061B3A,
#0B0F14
);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}



.box{

background:white;

padding:35px;

width:100%;

max-width:400px;

border-radius:20px;

box-shadow:
0 15px 40px rgba(0,0,0,.3);

}



h2{

text-align:center;

margin-bottom:10px;

color:#061B3A;

}



p{

text-align:center;

color:#666;

margin-bottom:20px;

font-size:14px;

}



input{

width:100%;

padding:14px;

margin:10px 0;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;

}



input:focus{

outline:2px solid var(--blue);

}



button{

width:100%;

padding:14px;

background:var(--blue);

color:white;

border:none;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}



button:disabled{

opacity:.6;

cursor:not-allowed;

}



button:hover{

background:var(--yellow);

color:black;

}



#message{

margin-top:15px;

font-weight:bold;

}



.back{

display:block;

text-align:center;

margin-top:20px;

text-decoration:none;

color:var(--blue);

font-weight:bold;

}


</style>


</head>


<body>



<div class="box">


<h2>

Forgot Password

</h2>


<p>

Enter your admin email to receive a password reset OTP.

</p>



<input

type="email"

id="email"

placeholder="Admin Email"

>



<button id="sendBtn" onclick="sendOTP()">

Send OTP

</button>



<p id="message"></p>



<a href="admin-login.html" class="back">

← Back to Login

</a>



</div>





<script>


const API =
"https://godnechez-creative-solutions.onrender.com";




async function sendOTP(){



const email =
document.getElementById("email").value.trim();



const message =
document.getElementById("message");



const button =
document.getElementById("sendBtn");




if(!email){


message.innerHTML =
"Please enter your email.";


return;


}



button.disabled=true;

button.innerHTML="Sending...";





try{


const res = await fetch(

API + "/api/admin/forgot-password",

{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({

email:email

})


}

);





const data = await res.json();





if(data.success){


message.innerHTML =
"OTP sent successfully. Redirecting...";



localStorage.setItem(

"resetEmail",

email

);





setTimeout(()=>{


window.location.href="verify-otp.html";


},1000);



}

else{


message.innerHTML =
data.message || "Failed to send OTP.";

button.disabled=false;

button.innerHTML="Send OTP";


}



}

catch(error){


console.log(error);


message.innerHTML =
"Server error. Check connection.";


button.disabled=false;

button.innerHTML="Send OTP";


}



}



</script>



</body>

</html>
