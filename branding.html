<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Branding Designs | GODNECHEZ CREATIVE</title>

<style>

:root{

--black:#0B0F14;
--dark:#061B3A;
--blue:#0f4cb4;
--yellow:#FFD400;
--red:#E63946;
--white:#ffffff;
--gray:#6B7280;

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}

body{

background:var(--white);
color:var(--black);
overflow-x:hidden;

}

/* NAVBAR */

header{

position:fixed;
top:0;
width:100%;
background:rgba(255,255,255,.95);
backdrop-filter:blur(15px);
border-bottom:1px solid #eee;
z-index:1000;
animation:navDrop .8s ease;

}

@keyframes navDrop{

from{
transform:translateY(-100%);
}

to{
transform:translateY(0);
}

}

.navbar{

max-width:1200px;
margin:auto;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;

}

/* BRAND */

.brand{

display:flex;
align-items:center;
gap:12px;

}

.brand img{

width:45px;
height:45px;
object-fit:contain;

}

.logo-text{

display:flex;
flex-direction:column;
font-size:20px;
font-weight:900;
line-height:1;

}

.logo-text span{

font-size:11px;
letter-spacing:1px;
color:var(--blue);

}

/* NAV */

.nav{

display:flex;
align-items:center;
gap:22px;

}

.nav a{

text-decoration:none;
color:#111;
font-weight:bold;
font-size:14px;
transition:.3s;

}

.nav a:hover{

color:var(--red);

}

.admin-link{

background:var(--yellow);
padding:10px 18px;
border-radius:30px;
color:black !important;

}

.menu{

display:none;
font-size:28px;
cursor:pointer;

}

/* HERO */

.hero{

text-align:center;
padding:150px 20px 50px;
background:
radial-gradient(
circle at top right,
rgba(255,212,0,.2),
transparent 35%
);
animation:fadeUp 1s ease;

}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(50px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.hero h1{

font-size:3rem;

}

.hero span{

color:var(--blue);

}

.hero p{

margin-top:15px;
color:var(--gray);
font-size:18px;

}

</style>

</head>

<body>

<header>

<div class="navbar">

<div class="brand">

<img src="images/Untitled-1.png" alt="GODNECHEZ Logo">

<div class="logo-text">

GODNECHEZ

<span>
CREATIVE SOLUTIONS
</span>

</div>

</div>

<div class="nav" id="nav">

<a href="home.html">Home</a>

<a href="portfolio.html">Portfolio</a>

<a href="services.html">Services</a>

<a href="about.html">About</a>

<a href="faq.html">FAQ</a>

<a href="testimonials.html">Testimonials</a>

<a href="contact.html">Contact</a>

<a href="admin-login.html" class="admin-link">
👤 Admin Login
</a>

</div>

<div class="menu" onclick="toggleMenu()">
☰
</div>

</div>

</header>

<section class="hero">

<h1>

Branding

<span>
Gallery
</span>

</h1>

<p>
Explore our branding and identity design collection.
</p>

</section>

<div class="categories">

<a href="portfolio.html">
All
</a>

<a href="logos.html">
Logos
</a>

<a href="flyers.html">
Flyers
</a>

<a href="branding.html" class="active">
Branding
</a>

<a href="dtf.html">
DTF
</a>

<a href="banners.html">
Banners
</a>

</div>

<section class="gallery" id="gallery">

</section>

<div class="load">

<button onclick="loadMore()">

Load More Branding Designs

</button>

</div>

<div class="modal" id="modal" onclick="closeModal()">

<img id="modalImage">

</div>

<footer>

© 2026 GODNECHEZ CREATIVE SOLUTIONS

</footer>

<script>

const API =
"https://godnechez-creative-solutions.onrender.com";

let branding = [];

let visible = 12;

async function getBranding(){

try{

const res = await fetch(
API + "/api/designs"
);

const data = await res.json();

branding = data.data.filter(item =>

(item.category || "").toLowerCase() === "branding"

);

display();

}

catch(err){

console.log(err);

}

}

function display(){

const gallery =
document.getElementById("gallery");

gallery.innerHTML = "";

branding
.slice(0, visible)
.forEach(item => {

gallery.innerHTML += `

<div class="card"
onclick="openModal('${item.image}')">

<img
src="${item.image}"
alt="${item.title || 'Branding Design'}">

<div class="info">

<h3>
${item.title || "Branding Design"}
</h3>

<small>
${item.category || "Branding"}
</small>

</div>

</div>

`;

});

}

function loadMore(){

visible += 12;

display();

}

function openModal(image){

document
.getElementById("modal")
.style.display = "flex";

document
.getElementById("modalImage")
.src = image;

}

function closeModal(){

document
.getElementById("modal")
.style.display = "none";

}

function toggleMenu(){

document
.getElementById("nav")
.classList.toggle("show");

}

getBranding();

</script>

</body>

</html>
