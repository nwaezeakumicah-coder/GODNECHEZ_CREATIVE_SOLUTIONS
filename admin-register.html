<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Admin | GODNECHEZ</title>


<style>

:root{

--blue:#0A3D91;
--navy:#061B3A;
--white:#FFFFFF;
--yellow:#FFD400;
--red:#E63946;
--gray:#6B7280;

}


*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,sans-serif;

}



body{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:20px;

background:

radial-gradient(circle at top right,

rgba(255,212,0,.2),

transparent 35%),

var(--blue);

}




.container{

background:white;

width:100%;

max-width:380px;

padding:35px;

border-radius:25px;

box-shadow:0 20px 50px rgba(0,0,0,.25);

}



h2{

text-align:center;

color:var(--navy);

margin-bottom:25px;

}




input{

width:100%;

padding:14px;

margin:10px 0;

border-radius:10px;

border:1px solid #ddd;

outline:none;

font-size:15px;

}



input:focus{

border-color:var(--blue);

}





button{

width:100%;

padding:15px;

margin-top:10px;

background:var(--yellow);

color:var(--navy);

border:none;

border-radius:30px;

font-weight:bold;

cursor:pointer;

font-size:15px;

transition:.3s;

}



button:hover{

background:var(--red);

color:white;

transform:translateY(-2px);

}





#message{

margin-top:15px;

text-align:center;

font-weight:bold;

color:var(--blue);

}




</style>


</head>


<body>



<div class="container">


<h2>

Create Admin Account

</h2>



<input 

id="username"

placeholder="Username"

>



<input

id="email"

type="email"

placeholder="Email"

>



<input

id="password"

type="password"

placeholder="Password"

>




<button onclick="registerAdmin()">

Create Account

</button>




<p id="message"></p>



</div>






<script>


const API="https://godnechez-creative-solutions.onrender.com";




async function registerAdmin(){



const data={


username:document.getElementById("username").value,


email:document.getElementById("email").value,


password:document.getElementById("password").value


};





try{



const res = await fetch(

API+"/api/admin/register",

{


method:"POST",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify(data)


}


);





const result = await res.json();





document.getElementById("message").innerHTML =

result.message;



}



catch(error){


document.getElementById("message").innerHTML =

"Unable to connect to server";


}



}



</script>



</body>

</html>
