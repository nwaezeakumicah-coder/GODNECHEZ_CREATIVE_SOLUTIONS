<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | GODNECHEZ</title>


<style>

:root{

--blue:#0f4cb4;
--dark:#0B0F14;
--yellow:#FFD400;

}



*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}



body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

background:linear-gradient(
135deg,
#061B3A,
#0B0F14
);

}




.login-box{


background:white;

width:100%;

max-width:380px;

padding:35px;

border-radius:20px;

box-shadow:0 20px 50px rgba(0,0,0,.3);


}




.logo{


text-align:center;

font-size:28px;

font-weight:900;

margin-bottom:10px;


}




.logo span{


color:var(--blue);


}





.subtitle{


text-align:center;

color:#666;

margin-bottom:25px;


}





input{


width:100%;

padding:14px;

margin:12px 0;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;


}





input:focus{


outline:2px solid var(--blue);


}




button{


width:100%;

padding:15px;

border:none;

border-radius:10px;

background:var(--yellow);

font-weight:bold;

cursor:pointer;


}




button:disabled{


opacity:.6;

cursor:not-allowed;


}





.links{


display:flex;

justify-content:space-between;

margin-top:15px;


}




.links a{


text-decoration:none;

color:#555;

font-size:14px;


}




#message{


margin-top:15px;

text-align:center;

font-weight:bold;

min-height:20px;


}





.back{


display:block;

text-align:center;

margin-top:20px;

text-decoration:none;

color:#555;


}



</style>


</head>



<body>




<div class="login-box">





<div class="logo">


GODNECHEZ <span>ADMIN</span>


</div>





<p class="subtitle">


Secure administrator access


</p>







<input


id="username"

placeholder="Username"


>






<input


id="password"

type="password"

placeholder="Password"


>








<button id="loginBtn">


LOGIN


</button>







<div class="links">


<a href="forgot-password.html">

Forgot Password?

</a>




<a href="admin-register.html">

Sign Up

</a>


</div>







<p id="message"></p>







<a class="back" href="home.html">


← Back to Website


</a>





</div>








<script>



const API =

"https://godnechez-creative-solutions.onrender.com";






if(localStorage.getItem("adminToken")){


window.location.href="admin.html";


}








const usernameInput =

document.getElementById("username");



const passwordInput =

document.getElementById("password");



const message =

document.getElementById("message");



const btn =

document.getElementById("loginBtn");









async function login(){





const username =

usernameInput.value.trim();




const password =

passwordInput.value.trim();







if(!username || !password){



message.innerHTML =

"Enter username and password";



return;


}







btn.disabled=true;


btn.innerHTML="Logging in...";








try{






const res = await fetch(



API + "/api/admin/login",



{


method:"POST",



headers:{



"Content-Type":"application/json"


},



body:JSON.stringify({


username,

password


})



}



);









const data = await res.json();









if(data.success){






localStorage.setItem(


"adminToken",


data.token


);








localStorage.setItem(


"adminRole",


data.role


);







message.innerHTML =

"Login successful";









setTimeout(()=>{



window.location.href="admin.html";



},500);






}

else{



message.innerHTML =

data.message || "Login failed";



}









}

catch(error){



console.log(error);



message.innerHTML =

"Server connection error";


}







btn.disabled=false;


btn.innerHTML="LOGIN";




}










btn.addEventListener(


"click",


login


);









document.addEventListener(


"keypress",


(e)=>{



if(e.key==="Enter"){


login();


}



}


);






</script>






</body>

</html>
