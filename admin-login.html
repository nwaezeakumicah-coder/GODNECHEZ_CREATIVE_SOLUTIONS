<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | GODNECHEZ</title>

<style>

:root{
--black:#0B0F14;
--yellow:#0f4cb4;
--dark:#171B24;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:linear-gradient(
135deg,
#0B0F14,
#171B24
);
}

.login-box{
background:white;
width:100%;
max-width:380px;
padding:35px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.logo{
text-align:center;
font-size:28px;
font-weight:900;
margin-bottom:10px;
}

.logo span{
color:var(--yellow);
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
font-size:14px;
}

input{
width:100%;
padding:14px;
margin:12px 0;
border-radius:10px;
border:1px solid #ddd;
outline:none;
font-size:15px;
}

input:focus{
border-color:var(--yellow);
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:var(--yellow);
font-weight:bold;
cursor:pointer;
font-size:15px;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

.forgot{
display:block;
text-align:center;
margin-top:15px;
text-decoration:none;
color:#555;
font-size:14px;
}

.forgot:hover{
color:black;
}

#message{
margin-top:15px;
text-align:center;
font-weight:bold;
color:#E63946;
min-height:20px;
}

.back{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
color:#555;
font-size:14px;
}

.back:hover{
color:black;
}

</style>

</head>

<body>


<div class="login-box">


<div class="logo">

GODNECHEZ <span>ADMIN</span>

</div>


<p class="subtitle">

Secure administrator access

</p>


<input

id="username"

placeholder="Username"

autocomplete="username"

>


<input

id="password"

type="password"

placeholder="Password"

autocomplete="current-password"

>


<button id="loginBtn" onclick="login()">

LOGIN

</button>


<a class="forgot" href="forgot-password.html">

Forgot Password?

</a>


<p id="message"></p>


<a class="back" href="index.html">

← Back to Website

</a>


</div>

<script>


const API="https://godnechez-creative-solutions.onrender.com";


const token=localStorage.getItem("adminToken");


if(token){

window.location.replace("admin.html");

}





async function login(){


const user=document.getElementById("username").value.trim();


const pass=document.getElementById("password").value.trim();



if(!user || !pass){


document.getElementById("message").innerHTML=

"Please enter username and password";


return;

}





const btn=document.getElementById("loginBtn");


btn.disabled=true;


btn.innerHTML="Logging in...";


document.getElementById("message").innerHTML="";





try{



const res=await fetch(

API+"/api/admin/login",

{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


username:user,


password:pass


})


}

);





const result=await res.json();





if(result.success){



localStorage.setItem(

"adminToken",

result.token

);



window.location.replace(

"admin.html"

);



}

else{


document.getElementById("message").innerHTML=

result.message || "Login failed";


}



}



catch(error){



document.getElementById("message").innerHTML=

"Unable to connect to server";


}





btn.disabled=false;


btn.innerHTML="LOGIN";


}






document.addEventListener("keypress",(e)=>{


if(e.key==="Enter"){


login();


}


});



</script>


</body>

</html>
